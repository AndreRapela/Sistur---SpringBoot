spring.application.name=sistur

# Datasource - Prioriza Supabase via variáveis de ambiente
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.kwddavsummldocvmafgn.supabase.co:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:a4oTJLl4fUUzP2Dc}
spring.datasource.driver-class-name=org.postgresql.Driver

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging (menos verboso em produção)
logging.level.org.springframework.web=INFO
logging.level.br.gov.noronha.sistur=INFO

# Google Auth
google.client.id=${GOOGLE_CLIENT_ID:10352554378-pk9fqug556o9qbeuom8ofom7o3u9vj0t.apps.googleusercontent.com}

# JWT / Supabase Security
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://kwddavsummldocvmafgn.supabase.co/auth/v1/.well-known/jwks.json
api.security.token.secret=${JWT_SECRET:a4oTJLl4fUUzP2Dc}
api.security.token.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=establishments,events,tours,touristPoints,items

# HTTP Compression
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.excluded-pathpatterns=/static/**,/public/**

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

spring.application.name=sistur

# Datasource - configure com o Postgres/Supabase real do ambiente
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database=postgresql
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Dados turisticos iniciais - roda contra o banco configurado
sistur.seed.enabled=${SISTUR_SEED_ENABLED:true}

# Logging
logging.level.org.springframework.web=INFO
logging.level.br.gov.noronha.sistur=INFO

# Google Auth
google.client.id=${GOOGLE_CLIENT_ID}

# JWT / Supabase Security
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URL}
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=establishments,events,tours,touristPoints,items

# HTTP Compression
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.excluded-pathpatterns=/static/**,/public/**

# Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

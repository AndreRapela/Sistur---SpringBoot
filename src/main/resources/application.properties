spring.application.name=sistur

# Datasource - configure com o Postgres/Supabase real do ambiente
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.database=postgresql
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Migrações versionadas para bancos Supabase existentes
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true

# Dados turisticos iniciais - roda contra o banco configurado
sistur.seed.enabled=${SISTUR_SEED_ENABLED:true}

# Logging
logging.level.org.springframework.web=INFO
logging.level.br.gov.noronha.sistur=INFO

# Health probes used by the deployment platform
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Google Auth
google.client.id=${GOOGLE_CLIENT_ID:}

# CORS - em producao use o dominio do frontend, separado por virgula quando houver mais de um
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://127.0.0.1:4307}

# JWT / Supabase Security
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URL:}
api.security.token.secret=${JWT_SECRET}
api.security.token.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
analytics.privacy-salt=${ANALYTICS_PRIVACY_SALT:${JWT_SECRET}}

# O SisTur usa seu próprio filtro JWT; não crie usuário/senha padrão do Spring.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=establishments,events,tours,touristPoints,items,ai_recommendations,public_itineraries

# Weather gateway - keep commercial API keys only on the backend
weather.open-meteo.forecast-url=${OPEN_METEO_FORECAST_URL:https://api.open-meteo.com/v1/forecast}
weather.open-meteo.marine-url=${OPEN_METEO_MARINE_URL:https://marine-api.open-meteo.com/v1/marine}
weather.open-meteo.api-key=${OPEN_METEO_API_KEY:}
weather.cache-minutes=${WEATHER_CACHE_MINUTES:10}

# HTTP Compression
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.excluded-pathpatterns=/static/**,/public/**
server.max-http-request-header-size=16KB
server.forward-headers-strategy=framework

# Baseline por instancia; mantenha tambem rate limit no proxy/WAF em producao distribuida
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.auth-per-minute=${RATE_LIMIT_AUTH_PER_MINUTE:30}
app.rate-limit.registration-per-hour=${RATE_LIMIT_REGISTRATION_PER_HOUR:20}
app.rate-limit.analytics-per-minute=${RATE_LIMIT_ANALYTICS_PER_MINUTE:600}
app.rate-limit.compute-per-minute=${RATE_LIMIT_COMPUTE_PER_MINUTE:120}

# Connection Pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.validation-timeout=${DB_VALIDATION_TIMEOUT_MS:5000}
spring.datasource.hikari.initialization-fail-timeout=${DB_INITIALIZATION_FAIL_TIMEOUT_MS:15000}
spring.datasource.hikari.data-source-properties.connectTimeout=${DB_CONNECT_TIMEOUT_SECONDS:10}
spring.datasource.hikari.data-source-properties.socketTimeout=${DB_SOCKET_TIMEOUT_SECONDS:30}
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true

# API documentation is disabled by default in public deployments
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
